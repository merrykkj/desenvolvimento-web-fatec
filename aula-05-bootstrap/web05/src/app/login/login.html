<h3>Faça seu login</h3>

<div class="alert alert-danger">
    <strong>Verifique!</strong> Email ou senha invalidos
</div>

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-4">
            <div class="text-center mb-4">
                Informe seu email e senha
                <label class="form-label">email:</label>
                <input type="email" id="txtEmail" class="form-control">
                <label class="form-label">senha:</label>
                <input type="password" id="txtSenha" class="form-control"><br>
                <button class="btn btn-success w-100">Entrar</button>
            </div>
        </div>
    </div>

    <div class="col">
        Caso tenha esquecido sua senha <br>
        <a href="reenvio" class="btn btn-outline-warning w-100">Reenviar senha</a>
    </div>

    <div class="col">
        Ainda não tem cadastro <br>
        <a href="cadatro" class="btn btn-outline-primary w-100">Novo cadastro</a>
    </div>
</div>
