<div class="container mt-4">
  <div class="card shadow p-4">
    <h3 class="mb-4 text-danger">Cadastro de Cliente - Loja Virtual</h3>

    <form class="was-validated">
      <div class="mb-3">
        <label for="txtNome" class="form-label">Nome Completo</label>
        <input type="text" class="form-control" id="txtNome" placeholder="Digite seu nome completo" required>
        <div class="invalid-feedback">Nome completo é obrigatório!</div>
      </div>

      <div class="mb-3">
        <label for="txtSenha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="txtSenha" placeholder="Digite sua senha" 
         pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$" required>
        <div class="invalid-feedback">Senha é obrigatória!</div>
      </div>

      <div class="mb-3">
        <label for="txtEmail" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="txtEmail" placeholder="seu@email.com" required>
        <div class="invalid-feedback">Email é obrigatório!</div>
      </div>

      <div class="mb-3">
        <label for="txtCpf" class="form-label">CPF</label>
        <input type="text" class="form-control" id="txtCpf" placeholder="000.000.000-00" required>
        <div class="invalid-feedback">CPF é obrigatório!</div>
      </div>

      <div class="mb-3">
        <label for="txtTelefone" class="form-label">Telefone / WhatsApp</label>
        <input type="text" class="form-control" id="txtTelefone" placeholder="(00) 00000-0000" required>
        <div class="invalid-feedback">Telefone é obrigatório!</div>
      </div>

      <button type="submit" class="btn btn-danger w-100">Gravar</button>
    </form>
  </div>
</div>
