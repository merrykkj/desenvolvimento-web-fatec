<div class="row justify-content-center"> 
  <div class="col-md-6 col-lg-5"> 
    <div class="card shadow-sm border-0 p-4"> 
      
      <div class="text-center mb-4"> 
        <h3 class="fw-bold text-dark">Faça seu cadastro</h3> 
        <small class="text-muted">Informe seus dados para acessar a plataforma</small> 
      </div> 

      <form> 
        <div class="mb-3"> 
          <label class="form-label fw-semibold">Nome Completo</label> 
          <input type="text" id="txtNome" class="form-control" placeholder="Digite seu nome"> 
        </div> 

        <div class="mb-3"> 
          <label class="form-label fw-semibold">Email</label> 
          <input type="email" id="txtEmail" class="form-control" placeholder="seu@email.com"> 
        </div> 

        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label fw-semibold">CPF</label> 
            <input type="text" id="txtCpf" class="form-control" placeholder="000.000.000-00"> 
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold">Telefone / Celular</label> 
            <input type="tel" id="txtTelefone" class="form-control" placeholder="(00) 00000-0000"> 
          </div>
        </div>

        <div class="mb-3"> 
          <label class="form-label fw-semibold">Senha</label> 
          <input type="password" id="txtSenha" class="form-control" placeholder="Crie uma senha"> 
        </div> 

        <div class="mb-3"> 
          <label class="form-label fw-semibold">Confirmar Senha</label> 
          <input type="password" id="txtConfirmarSenha" class="form-control" placeholder="Repita a senha"> 
        </div> 

        <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3">Cadastrar</button> 

        <div class="text-center"> 
          <span class="text-muted small">Já tem uma conta? </span>
          <a href="login" class="text-success text-decoration-none small fw-semibold">Faça Login</a> 
        </div> 
      </form> 

    </div> 
  </div> 
</div>
