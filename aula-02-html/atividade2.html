<!doctype html>
<html>

<head>
    <title>Tags de Objeto</title>
</head>

<body>
    <h1><font color="red" size="20">Contato</font></h1>
    <h3><i>
        Seja bem vindo, preencha o <b>formulario</b> abaixo para:
    </i></h3>
    <form>
        E-mail: <input type="email" id="email" placeholder="Informe um e-mail valido" required> <br><br>
        Nome: <input type="text" id="nome" placeholder="Digite seu nome completo" maxlength="100" required><br><br>
        Telefone: <input type="number" id="telefone" placeholder="Digite seu telefone" maxlength="10" required><br><br>
    </form>
</body>

</html>
