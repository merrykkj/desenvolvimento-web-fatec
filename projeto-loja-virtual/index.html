<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floricultura | Secret Garden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                        cursive: ['"Dancing Script"', 'cursive'],
                    }
                }
            }
        }
    </script>
</head>

<body>
    <header class="absolute top-0 left-0 w-full flex flex-col items-center gap-4 py-6 z-20">
        <div class="text-center">
            <h1 class="text-gray-900 text-3xl font-light tracking-wide">
                Secret
                <span
                    class="font-cursive font-bold text-pink-600 text-4xl hover:text-pink-700 transition-colors duration-300 relative top-1">
                    Garden
                </span>
            </h1>
        </div>

        <nav class="hidden sm:block">
            <ul class="flex gap-8 text-sm font-medium tracking-wide uppercase text-gray-700">
                <li><a href="#home" class="hover:text-pink-600 transition-colors duration-300">Home</a></li>
                <li><a href="#catalogo" class="hover:text-pink-600 transition-colors duration-300">Catálogo</a></li>
                <li><a href="#sobre" class="hover:text-pink-600 transition-colors duration-300">Sobre</a></li>
                <li><a href="#contato" class="hover:text-pink-600 transition-colors duration-300">Contato</a></li>
            </ul>
        </nav>
    </header>

    <section id="home"
        class="relative min-h-screen flex items-center pt-24 px-6 md:px-16 bg-[url('https://images.unsplash.com/photo-1602615576820-ea14cf3e476a?q=80&w=1170&auto=format&fit=crop')] bg-cover bg-center">
        <div class="absolute inset-0 bg-white/30 sm:bg-transparent"></div>

        <div class="relative z-10 max-w-xl text-left">
            <h2 class="text-4xl md:text-6xl font-serif font-bold text-pink-950 uppercase tracking-tight leading-tight">
                Fresh <br>Flowers
            </h2>

            <span class="text-sm md:text-base font-medium text-pink-600 block mt-2 tracking-widest uppercase">
                Natural & Beautiful Flowers
            </span>

            <p class="py-4 text-gray-700 leading-relaxed font-serif text-sm md:text-base">
                Flores frescas selecionadas diariamente para trazer mais cor, aroma e vida aos seus momentos especiais.
                Descubra nossas coleções exclusivas.
            </p>

            <a href="#"
                class="inline-block bg-pink-500 hover:bg-pink-700 text-white font-semibold py-3 px-8 transition transform hover:scale-105">
                Compre agora
            </a>
        </div>
    </section>

</body>


</html>
