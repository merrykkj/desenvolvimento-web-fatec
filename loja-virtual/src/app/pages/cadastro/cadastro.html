<main class="h-screen w-full grid grid-cols-1 lg:grid-cols-12 bg-white overflow-hidden">
    <div class="absolute top-6 right-6 lg:top-8 lg:right-8 z-20">
        <a routerLink="/"
            class="inline-flex items-center gap-2 px-4 py-2 bg-white/80 hover:bg-white text-gray-700 hover:text-pink-600 text-xs font-semibold uppercase tracking-wider rounded-full border border-pink-100 hover:border-pink-200 shadow-sm transition-all duration-200 backdrop-blur-md">
            <i class="fa-solid fa-arrow-left text-xs" aria-hidden="true"></i>
            <span>Voltar à Home</span>
        </a>
    </div>
    <div
        class="hidden lg:flex lg:col-span-6 relative bg-pink-950 flex-col justify-between p-12 text-white overflow-hidden">

        <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=1200&auto=format&fit=crop"
            alt="Coração de Flores Secret Garden" class="absolute inset-0 w-full h-full object-cover opacity-60">

        <div class="absolute inset-0 bg-gradient-to-t from-pink-950 via-pink-950/40 to-transparent"></div>

        <div class="relative z-10 pt-12">
            <span
                class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-white/20 backdrop-blur-md rounded-full text-xs font-semibold uppercase tracking-widest text-pink-100 border border-white/30">
                <i class="fa-solid fa-sparkles text-xs"></i> Faça Parte
            </span>
        </div>

        <div class="relative z-10 space-y-4 max-w-lg mb-8">
            <h2 class="text-4xl font-serif font-bold leading-tight drop-shadow-md">
                Crie memórias colhendo momentos.
            </h2>
            <p class="text-sm text-pink-100/90 leading-relaxed font-light">
                Cadastre-se na Secret Garden para guardar os seus arranjos favoritos, acompanhar entregas em tempo real
                e receber ofertas florais exclusivas.
            </p>
        </div>
    </div>

    <div
        class="lg:col-span-6 flex flex-col justify-center items-center px-6 sm:px-12 md:px-16 lg:px-20 py-6 sm:py-8 bg-gradient-to-br from-pink-50/50 via-white to-pink-50/30 overflow-y-auto lg:overflow-visible">

        <div class="w-full max-w-lg space-y-4">

            <div class="text-center">
                <div
                    class="inline-flex items-center justify-center w-12 h-12 bg-pink-100/80 text-pink-600 rounded-2xl mb-2 shadow-sm border border-pink-200/50">
                    <i class="fa-solid fa-seedling text-xl" aria-hidden="true"></i>
                </div>

                <h1 class="text-gray-900 text-2xl sm:text-3xl font-serif font-bold tracking-tight">
                    Secret
                    <a routerLink="/" class="text-pink-600 hover:text-pink-700 transition-colors cursor-pointer">
                        Garden
                    </a>
                </h1>
                <p class="text-[11px] text-gray-500 font-semibold uppercase tracking-widest mt-1">
                    Crie a sua conta
                </p>
            </div>

            <form class="flex flex-col gap-3" (ngSubmit)="$event.preventDefault()">

                <div>
                    <label for="nome" class="block text-[11px] font-bold text-gray-700 uppercase tracking-wider mb-1">
                        Nome Completo
                    </label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-pink-400">
                            <i class="fa-solid fa-user text-xs" aria-hidden="true"></i>
                        </span>
                        <input type="text" id="nome" placeholder="Seu nome e sobrenome" required
                            class="w-full pl-10 pr-4 py-2.5 bg-white border border-pink-200 rounded-2xl text-gray-800 placeholder-gray-400 text-xs outline-none transition duration-200 focus:border-pink-500 focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-[11px] font-bold text-gray-700 uppercase tracking-wider mb-1">
                        E-mail
                    </label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-pink-400">
                            <i class="fa-solid fa-envelope text-xs" aria-hidden="true"></i>
                        </span>
                        <input type="email" id="email" placeholder="seu@email.com" required
                            class="w-full pl-10 pr-4 py-2.5 bg-white border border-pink-200 rounded-2xl text-gray-800 placeholder-gray-400 text-xs outline-none transition duration-200 focus:border-pink-500 focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div>
                        <label for="telefone"
                            class="block text-[11px] font-bold text-gray-700 uppercase tracking-wider mb-1">
                            WhatsApp / Telemóvel
                        </label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-pink-400">
                                <i class="fa-brands fa-whatsapp text-sm" aria-hidden="true"></i>
                            </span>
                            <input type="tel" id="telefone" placeholder="(00) 90000-0000"
                                class="w-full pl-10 pr-4 py-2.5 bg-white border border-pink-200 rounded-2xl text-gray-800 placeholder-gray-400 text-xs outline-none transition duration-200 focus:border-pink-500 focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                        </div>
                    </div>

                    <div>
                        <label for="nascimento"
                            class="block text-[11px] font-bold text-gray-700 uppercase tracking-wider mb-1">
                            Data de Nascimento
                        </label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-pink-400">
                                <i class="fa-solid fa-cake-candles text-xs" aria-hidden="true"></i>
                            </span>
                            <input type="date" id="nascimento"
                                class="w-full pl-10 pr-4 py-2.5 bg-white border border-pink-200 rounded-2xl text-gray-600 placeholder-gray-400 text-xs outline-none transition duration-200 focus:border-pink-500 focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div>
                        <label for="senha"
                            class="block text-[11px] font-bold text-gray-700 uppercase tracking-wider mb-1">
                            Senha
                        </label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-pink-400">
                                <i class="fa-solid fa-lock text-xs" aria-hidden="true"></i>
                            </span>
                            <input type="password" id="senha" placeholder="Mínimo 8 caracteres" required
                                class="w-full pl-10 pr-4 py-2.5 bg-white border border-pink-200 rounded-2xl text-gray-800 placeholder-gray-400 text-xs outline-none transition duration-200 focus:border-pink-500 focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                        </div>
                    </div>

                    <div>
                        <label for="confirmar-senha"
                            class="block text-[11px] font-bold text-gray-700 uppercase tracking-wider mb-1">
                            Confirmar Senha
                        </label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-pink-400">
                                <i class="fa-solid fa-shield-halved text-xs" aria-hidden="true"></i>
                            </span>
                            <input type="password" id="confirmar-senha" placeholder="Repita a senha" required
                                class="w-full pl-10 pr-4 py-2.5 bg-white border border-pink-200 rounded-2xl text-gray-800 placeholder-gray-400 text-xs outline-none transition duration-200 focus:border-pink-500 focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between py-0.5">
                    <label class="flex items-start cursor-pointer select-none">
                        <input type="checkbox" id="terms" required
                            class="w-3.5 h-3.5 mt-0.5 text-pink-600 border-pink-300 rounded focus:ring-pink-500 accent-pink-600 cursor-pointer">
                        <span class="ml-2 text-[11px] font-medium text-gray-600 leading-snug">
                            Eu aceito os <a routerLink="/termos"
                                class="text-pink-600 font-semibold hover:underline">Termos</a> e a <a
                                routerLink="/privacidade" class="text-pink-600 font-semibold hover:underline">Política
                                de Privacidade</a>.
                        </span>
                    </label>
                </div>

                <button type="submit" routerLink="/login"
                    class="w-full mt-1 bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white font-semibold py-3 rounded-2xl shadow-lg shadow-pink-500/25 active:scale-[0.98] transition duration-200 cursor-pointer flex items-center justify-center gap-2 group text-xs">
                    <span>Criar Minha Conta</span>
                    <i class="fa-solid fa-arrow-right text-xs transition-transform duration-200 group-hover:translate-x-1"
                        aria-hidden="true"></i>
                </button>

                <div class="relative my-1.5 flex items-center justify-center">
                    <div class="border-t border-gray-200 w-full"></div>
                    <span
                        class="bg-white px-3 text-[10px] font-semibold text-gray-400 uppercase tracking-widest absolute">Ou
                        cadastre-se com</span>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <button type="button"
                        class="flex items-center justify-center gap-2 border border-gray-200 hover:border-pink-300 bg-white py-2 rounded-xl text-xs font-semibold text-gray-700 hover:bg-pink-50/50 transition shadow-sm">
                        <i class="fa-brands fa-google text-red-500 text-xs"></i> Google
                    </button>
                    <button type="button"
                        class="flex items-center justify-center gap-2 border border-gray-200 hover:border-pink-300 bg-white py-2 rounded-xl text-xs font-semibold text-gray-700 hover:bg-pink-50/50 transition shadow-sm">
                        <i class="fa-brands fa-facebook text-blue-600 text-xs"></i> Facebook
                    </button>
                </div>

                <p class="text-center text-[11px] text-gray-600 mt-1">
                    Já possui uma conta ativa?
                    <a routerLink="/login"
                        class="font-bold text-pink-600 hover:text-pink-700 hover:underline transition">
                        Fazer Login
                    </a>
                </p>
            </form>

        </div>

    </div>
</main>
