<main class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-10 relative overflow-hidden my-10 mt-20">

    <div class="relative z-10 w-full max-w-5xl bg-white/90 backdrop-blur-md rounded-3xl shadow-lg shadow-pink-900/10 border border-white/60 overflow-hidden grid grid-cols-1 md:grid-cols-12">
        
        <div class="hidden md:flex md:col-span-5 relative bg-gradient-to-t from-pink-950/80 via-pink-900/40 to-transparent flex-col justify-end p-8 text-white">
            <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=800&auto=format&fit=crop" 
                 alt="Coração de Flores Secret Garden" 
                 class="absolute inset-0 w-full h-full object-cover -z-10 mix-blend-overlay">
            
            <div class="space-y-2">
                <span class="inline-block px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-xs font-semibold uppercase tracking-widest text-pink-100 border border-white/30">
                    Faça Parte
                </span>
                <h2 class="text-3xl font-serif font-bold leading-tight drop-shadow-sm">
                    Crie memórias colhendo momentos.
                </h2>
                <p class="text-xs text-pink-100/90 leading-relaxed font-light">
                    Cadastre-se na Secret Garden para guardar os seus arranjos favoritos, acompanhar entregas em tempo real e receber ofertas florais exclusivas.
                </p>
            </div>
        </div>

        <div class="md:col-span-7 p-6 sm:p-8 md:p-10 flex flex-col justify-center">
            
            <!-- Logótipo e Ícone -->
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-pink-100/80 text-pink-600 rounded-full mb-2 shadow-inner">
                    <i class="fa-solid fa-seedling text-xl" aria-hidden="true"></i>
                </div>
                
                <h1 class="text-gray-900 text-2xl sm:text-3xl font-serif font-bold tracking-tight">
                    Secret 
                    <a routerLink="/home" class="text-pink-600 hover:text-pink-700 transition-colors cursor-pointer">
                        Garden
                    </a>
                </h1>
                <p class="text-xs text-gray-500 font-semibold uppercase tracking-widest mt-1">
                    Crie a sua conta
                </p>
            </div>

            <form class="flex flex-col gap-3.5" (ngSubmit)="$event.preventDefault()">
                
                <div>
                    <label for="nome" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">
                        Nome Completo
                    </label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-pink-400">
                            <i class="fa-solid fa-user text-sm" aria-hidden="true"></i>
                        </span>
                        <input type="text" id="nome" placeholder="Seu nome e sobrenome" required
                            class="w-full pl-10 pr-4 py-2.5 bg-pink-50/40 border border-pink-100 rounded-2xl text-gray-800 placeholder-gray-400 text-sm outline-none transition duration-200 focus:border-pink-500 focus:bg-white focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">
                        E-mail
                    </label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-pink-400">
                            <i class="fa-solid fa-envelope text-sm" aria-hidden="true"></i>
                        </span>
                        <input type="email" id="email" placeholder="seu@email.com" required
                            class="w-full pl-10 pr-4 py-2.5 bg-pink-50/40 border border-pink-100 rounded-2xl text-gray-800 placeholder-gray-400 text-sm outline-none transition duration-200 focus:border-pink-500 focus:bg-white focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                    </div>
                </div>

                <!-- Telefone e Data de Nascimento em Grid (2 colunas) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label for="telefone" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">
                            WhatsApp / Telemóvel
                        </label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-pink-400">
                                <i class="fa-brands fa-whatsapp text-base" aria-hidden="true"></i>
                            </span>
                            <input type="tel" id="telefone" placeholder="(00) 90000-0000"
                                class="w-full pl-10 pr-4 py-2.5 bg-pink-50/40 border border-pink-100 rounded-2xl text-gray-800 placeholder-gray-400 text-sm outline-none transition duration-200 focus:border-pink-500 focus:bg-white focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                        </div>
                    </div>

                    <div>
                        <label for="nascimento" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">
                            Data de Nascimento
                        </label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-pink-400">
                                <i class="fa-solid fa-cake-candles text-sm" aria-hidden="true"></i>
                            </span>
                            <input type="date" id="nascimento"
                                class="w-full pl-10 pr-4 py-2.5 bg-pink-50/40 border border-pink-100 rounded-2xl text-gray-600 placeholder-gray-400 text-sm outline-none transition duration-200 focus:border-pink-500 focus:bg-white focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label for="senha" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">
                            Senha
                        </label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-pink-400">
                                <i class="fa-solid fa-lock text-sm" aria-hidden="true"></i>
                            </span>
                            <input type="password" id="senha" placeholder="Mínimo 8 caracteres" required
                                class="w-full pl-10 pr-10 py-2.5 bg-pink-50/40 border border-pink-100 rounded-2xl text-gray-800 placeholder-gray-400 text-sm outline-none transition duration-200 focus:border-pink-500 focus:bg-white focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                        </div>
                    </div>

                    <div>
                        <label for="confirmar-senha" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">
                            Confirmar Senha
                        </label>
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-pink-400">
                                <i class="fa-solid fa-shield-halved text-sm" aria-hidden="true"></i>
                            </span>
                            <input type="password" id="confirmar-senha" placeholder="Repita a senha" required
                                class="w-full pl-10 pr-10 py-2.5 bg-pink-50/40 border border-pink-100 rounded-2xl text-gray-800 placeholder-gray-400 text-sm outline-none transition duration-200 focus:border-pink-500 focus:bg-white focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-between py-1">
                    <label class="flex items-start cursor-pointer select-none">
                        <input type="checkbox" id="terms" required
                            class="w-4 h-4 mt-0.5 text-pink-600 border-pink-200 rounded focus:ring-pink-500 accent-pink-600 cursor-pointer">
                        <span class="ml-2 text-xs font-medium text-gray-600 leading-snug">
                            Eu aceito os <a routerLink="/termos" class="text-pink-600 font-semibold hover:underline">Termos de Serviço</a> e a <a routerLink="/privacidade" class="text-pink-600 font-semibold hover:underline">Política de Privacidade</a>.
                        </span>
                    </label>
                </div>
                <button type="submit" routerLink="/catalogo"
                    class="w-full mt-1 bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white font-semibold py-3 rounded-2xl shadow-lg shadow-pink-500/25 active:scale-[0.98] transition duration-200 cursor-pointer flex items-center justify-center gap-2 group">
                    <span>Criar Minha Conta</span>
                    <i class="fa-solid fa-arrow-right text-sm transition-transform duration-200 group-hover:translate-x-1" aria-hidden="true"></i>
                </button>

                <div class="relative my-2 flex items-center justify-center">
                    <div class="border-t border-gray-200 w-full"></div>
                    <span class="bg-white px-3 text-[10px] font-semibold text-gray-400 uppercase tracking-widest absolute">Ou cadastre-se com</span>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button type="button" class="flex items-center justify-center gap-2 border border-gray-200 hover:border-pink-300 bg-white py-2 rounded-xl text-xs font-semibold text-gray-700 hover:bg-pink-50/50 transition">
                        <i class="fa-brands fa-google text-red-500 text-sm"></i> Google
                    </button>
                    <button type="button" class="flex items-center justify-center gap-2 border border-gray-200 hover:border-pink-300 bg-white py-2 rounded-xl text-xs font-semibold text-gray-700 hover:bg-pink-50/50 transition">
                        <i class="fa-brands fa-facebook text-blue-600 text-sm"></i> Facebook
                    </button>
                </div>

                <p class="text-center text-xs text-gray-600 mt-2">
                    Já possui uma conta ativa?
                    <a routerLink="/login" class="font-bold text-pink-600 hover:text-pink-700 hover:underline transition">
                        Fazer Login
                    </a>
                </p>
            </form>
        </div>

    </div>
</main>
