<main class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-10 relative overflow-hidden mt-20">

    <div class="relative z-10 w-full max-w-4xl bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl shadow-pink-900/10 border border-white/60 overflow-hidden grid grid-cols-1 md:grid-cols-12">
        
        <div class="hidden md:flex md:col-span-5 relative bg-gradient-to-t from-pink-950/80 via-pink-900/40 to-transparent flex-col justify-end p-8 text-white">
            <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=800&auto=format&fit=crop" 
                 alt="Arranjo de Flores Secret Garden" 
                 class="absolute inset-0 w-full h-full object-cover -z-10 mix-blend-overlay">
            
            <div class="space-y-2">
                <span class="inline-block px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-xs font-semibold uppercase tracking-widest text-pink-100 border border-white/30">
                    Sinta o Aroma
                </span>
                <h2 class="text-3xl font-serif font-bold leading-tight drop-shadow-sm">
                    Espalhe amor com flores frescas.
                </h2>
                <p class="text-xs text-pink-100/90 leading-relaxed font-light">
                    Aceda à sua conta para acompanhar encomendas e receber ofertas exclusivas no Secret Garden.
                </p>
            </div>
        </div>

        <div class="md:col-span-7 p-8 sm:p-10 md:p-12 flex flex-col justify-center">
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-pink-100/80 text-pink-600 rounded-full mb-3 shadow-inner">
                    <i class="fa-solid fa-seedling text-2xl" aria-hidden="true"></i>
                </div>
                
                <h1 class="text-gray-900 text-3xl font-serif font-bold tracking-tight">
                    Secret 
                    <a routerLink="/" class="text-pink-600 hover:text-pink-700 transition-colors cursor-pointer">
                        Garden
                    </a>
                </h1>
                <p class="text-xs text-gray-500 font-semibold uppercase tracking-widest mt-1">
                    Bem-vindo de volta!
                </p>
            </div>

            <form class="flex flex-col gap-4" (ngSubmit)="$event.preventDefault()">
                
                <div>
                    <label for="email" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">
                        E-mail
                    </label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-pink-400">
                            <i class="fa-solid fa-envelope text-base" aria-hidden="true"></i>
                        </span>
                        <input type="email" id="email" placeholder="seu@email.com" required
                            class="w-full pl-11 pr-4 py-3 bg-pink-50/40 border border-pink-100 rounded-2xl text-gray-800 placeholder-gray-400 text-sm outline-none transition duration-200 focus:border-pink-500 focus:bg-white focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="senha" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">
                            Senha
                        </label>
                        <a routerLink="/recuperar-senha" class="text-xs font-semibold text-pink-600 hover:text-pink-700 hover:underline transition">
                            Esqueceu a senha?
                        </a>
                    </div>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-pink-400">
                            <i class="fa-solid fa-lock text-base" aria-hidden="true"></i>
                        </span>
                        <input type="password" id="senha" placeholder="••••••••" required
                            class="w-full pl-11 pr-11 py-3 bg-pink-50/40 border border-pink-100 rounded-2xl text-gray-800 placeholder-gray-400 text-sm outline-none transition duration-200 focus:border-pink-500 focus:bg-white focus:ring-4 focus:ring-pink-500/10 shadow-sm">
                        
                        <button type="button" aria-label="Mostrar senha" class="absolute right-4 text-gray-400 hover:text-pink-600 transition">
                            <i class="fa-solid fa-eye text-sm" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between py-1">
                    <label class="flex items-center cursor-pointer select-none">
                        <input type="checkbox" id="remember"
                            class="w-4 h-4 text-pink-600 border-pink-200 rounded focus:ring-pink-500 accent-pink-600 cursor-pointer">
                        <span class="ml-2 text-xs font-medium text-gray-600">Lembrar das minhas informações</span>
                    </label>
                </div>

                <button type="submit" routerLink="/catalogo"
                    class="w-full mt-2 bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-pink-500/25 active:scale-[0.98] transition duration-200 cursor-pointer flex items-center justify-center gap-2 group">
                    <span>Entrar no Jardim</span>
                    <i class="fa-solid fa-arrow-right text-sm transition-transform duration-200 group-hover:translate-x-1" aria-hidden="true"></i>
                </button>

                <div class="relative my-4 flex items-center justify-center">
                    <div class="border-t border-gray-200 w-full"></div>
                    <span class="bg-white px-3 text-[11px] font-semibold text-gray-400 uppercase tracking-widest absolute">Ou entre com</span>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button type="button" class="flex items-center justify-center gap-2 border border-gray-200 hover:border-pink-300 bg-white py-2.5 rounded-xl text-xs font-semibold text-gray-700 hover:bg-pink-50/50 transition">
                        <i class="fa-brands fa-google text-red-500 text-sm"></i> Google
                    </button>
                    <button type="button" class="flex items-center justify-center gap-2 border border-gray-200 hover:border-pink-300 bg-white py-2.5 rounded-xl text-xs font-semibold text-gray-700 hover:bg-pink-50/50 transition">
                        <i class="fa-brands fa-facebook text-blue-600 text-sm"></i> Facebook
                    </button>
                </div>

                <p class="text-center text-xs text-gray-600 mt-4">
                    Ainda não tem uma conta?
                    <a routerLink="/cadastro" class="font-bold text-pink-600 hover:text-pink-700 hover:underline transition">
                        Cadastre-se gratuitamente
                    </a>
                </p>
            </form>
        </div>

    </div>
</main>
